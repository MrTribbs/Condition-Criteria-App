name: Build & Release Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3. Get version from installer.iss
      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $issPath = "${{ github.workspace }}\installer.iss"
          $content = Get-Content $issPath -Raw
          $match = [regex]::Match($content, '(?m)^\s*AppVersion\s*=\s*(.+)$')
          $version = if ($match.Success) { $match.Groups[1].Value.Trim('"') } else { "1.0.0" }
          Write-Host "Version: $version"
          Add-Content -Path $Env:GITHUB_OUTPUT -Value "version=$version"

      # 4. Publish App
      - name: Publish App
        shell: pwsh
        run: |
          $projectPath = "${{ github.workspace }}\Condition Criteria App.csproj"
          dotnet publish "`"$projectPath`"" -c Release -r win-x64 --self-contained true -o publish\win-x64

      # 5. Prepare installer folder
      - name: Prepare Installer Files
        shell: pwsh
        run: |
          $installerBuild = "${{ github.workspace }}\installer-build"
          New-Item -ItemType Directory -Path $installerBuild -Force | Out-Null
          Copy-Item -Path "${{ github.workspace }}\publish\win-x64\*" -Destination $installerBuild -Recurse -Force

      # 6. Install Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # 7. Remove old installer EXE
      - name: Remove old installer EXE
        shell: pwsh
        run: |
          $oldInstaller = "${{ github.workspace }}\installer-build\ConditionCriteriaInstaller.exe"
          if (Test-Path $oldInstaller) { Remove-Item $oldInstaller -Force }

      # 8. Build Installer
      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/O${{ github.workspace }}\installer-build" "${{ github.workspace }}\installer.iss"
          dir "${{ github.workspace }}\installer-build"

      # 9. Create update.json
      - name: Create update manifest
        shell: pwsh
        run: |
          $version = '${{ steps.get_version.outputs.version }}'
          $installerName = 'ConditionCriteriaInstaller.exe'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$installerName"
          $notes = "Release $version"
          $obj = @{ version = $version; url = $url; notes = $notes }
          $json = $obj | ConvertTo-Json -Compress
          Set-Content -Path update.json -Value $json -Encoding UTF8

      # 10. Create Release and Upload Files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: "Automated release for version ${{ steps.get_version.outputs.version }}"
          files: |
            installer-build/ConditionCriteriaInstaller.exe
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}